name: Build and Deploy Snapshot
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire test selector (space or comma separated); empty runs the full suite'
        required: false
        default: ''
permissions:
  contents: read

jobs:
  build:
    # Here we DO need "os" option, to include Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java_version: ['8', '17', '21', '25']
        os: ['ubuntu-24.04']
        include:
          - java_version: '8'
            os: 'ubuntu-24.04'
            release_build: 'R'
          - java_version: '8'
            os: 'windows-latest'
            is_windows: 'W'
    env:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
    - name: Set up JDK
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
        server-id: central-snapshots
        server-username: CI_DEPLOY_USERNAME
        server-password: CI_DEPLOY_PASSWORD
        # See https://github.com/actions/setup-java/blob/v2/docs/advanced-usage.md#Publishing-using-Apache-Maven
        # gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        # gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
    - name: Build
      shell: bash
      env:
        FILTER: ${{ inputs.test-filter }}
      run: |
        if [ -n "$FILTER" ]; then
          ./mvnw -B -ff -ntp verify -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          ./mvnw -B -ff -ntp verify
        fi
    - name: List skipped tests with reasons
      if: ${{ always() }}
      shell: bash
      run: |
        PY=$(command -v python3 || command -v python)
        "$PY" - <<'EOF'
        import glob, xml.etree.ElementTree as ET
        n = 0
        for f in sorted(glob.glob('target/**/TEST-*.xml', recursive=True)):
            for tc in ET.parse(f).getroot().iter('testcase'):
                sk = tc.find('skipped')
                if sk is not None:
                    n += 1
                    msg = (sk.get('message') or (sk.text or '').strip() or 'no message').splitlines()[0]
                    print("SKIPPED: %s.%s -- reason: %s" % (tc.get('classname'), tc.get('name'), msg))
        print("Total skipped testcases: %d" % n)
        EOF
    - name: Upload jar
      if: ${{ matrix.release_build }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: jackson-databind-jar
        path: target/jackson-databind-*[0-9].jar
        if-no-files-found: error
    - name: Extract project Maven version
      id: projectVersion
      if: ${{ !matrix.is_windows }}
      run: echo "version=$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -DforceStdout -Dexpression=project.version -q)" >> $GITHUB_OUTPUT
    - name: Verify Android SDK Compatibility
      if: ${{ matrix.release_build }}
      run: ./mvnw -B -q -ff -ntp -DskipTests animal-sniffer:check
    - name: Deploy snapshot
      if: ${{ false && matrix.release_build && github.event_name != 'pull_request' && endsWith(steps.projectVersion.outputs.version, '-SNAPSHOT') }}
      env:
        CI_DEPLOY_USERNAME: ${{ secrets.CENTRAL_DEPLOY_USERNAME }}
        CI_DEPLOY_PASSWORD: ${{ secrets.CENTRAL_DEPLOY_PASSWORD }}
        # MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: ./mvnw -B -q -ff -DskipTests -ntp source:jar deploy
    - name: Generate code coverage 
      if: ${{ matrix.release_build && github.event_name != 'pull_request' }}
      run: ./mvnw -B -q -ff -ntp test
    - name: Publish code coverage
      if: ${{ false && matrix.release_build && github.event_name != 'pull_request' }}
      uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests

